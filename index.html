<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juwon's Music Player 🌸</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --primary-color: #f48fb1;
            --text-color: #6d4c41;
            --shadow: 0 10px 25px rgba(244, 143, 177, 0.25);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }

        .player-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Vinyl Record Style */
        .vinyl-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 25px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            background: #212121;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 4s linear infinite;
            animation-play-state: paused; /* Berhenti kalau tak play */
            background-image: 
                radial-gradient(circle, transparent 35%, #2c2c2c 36%, #2c2c2c 38%, transparent 39%),
                radial-gradient(circle, transparent 55%, #2c2c2c 56%, #2c2c2c 58%, transparent 59%),
                radial-gradient(circle, transparent 75%, #2c2c2c 76%, #2c2c2c 78%, transparent 79%);
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-center {
            width: 70px;
            height: 70px;
            background: var(--primary-color);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Song Info */
        .song-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .song-artist {
            font-size: 0.9rem;
            color: #b0bec5;
            margin-bottom: 20px;
        }

        /* Audio Visualizer (Waveform bars) */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 35px;
            margin-bottom: 25px;
            width: 100%;
        }

        .bar {
            width: 6px;
            background-color: var(--primary-color);
            border-radius: 3px;
            height: 5px; /* Default rendah */
            transition: height 0.1s ease;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        button {
            flex: 1;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(244, 143, 177, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.96);
        }

        button:hover {
            background-color: #ec407a;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- Vinyl Record Graphic -->
        <div class="vinyl-container">
            <div class="vinyl" id="vinylRecord">
                <div class="vinyl-center"></div>
            </div>
        </div>

        <div class="song-title">Sampai Akhir</div>
        <div class="song-artist">Juwon's Playlist 🌸</div>

        <!-- Visualizer Bars -->
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Controls & Audio Element -->
        <audio id="audioPlayer" src="sampai-akhir.mp3"></audio>
        
        <div class="controls">
            <button id="playBtn">Play 🎵</button>
            <button id="pauseBtn">Pause ⏸️</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const vinyl = document.getElementById('vinylRecord');
        const bars = document.querySelectorAll('.bar');

        let audioCtx, analyser, source, dataArray;
        let isInitialized = false;

        function initAudioContext() {
            if (isInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isInitialized = true;
            } catch (e) {
                console.log("Web Audio API not supported", e);
            }
        }

        playBtn.addEventListener('click', () => {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audio.play();
            vinyl.classList.add('playing');
            animateVisualizer();
        });

        pauseBtn.addEventListener('click', () => {
            audio.pause();
            vinyl.classList.remove('playing');
        });

        function animateVisualizer() {
            if (!audio.paused) {
                requestAnimationFrame(animateVisualizer);
                if (analyser) {
                    analyser.getByteFrequencyData(dataArray);
                    bars.forEach((bar, index) => {
                        // Ambil nilai frequency untuk kawal tinggi bar
                        let value = dataArray[index * 2] || 5;
                        let height = (value / 255) * 35 + 5; // Tinggi maksimum bar
                        bar.style.height = height + 'px';
                    });
                } else {
                    // Fallback animation kalau browser sekat audio context
                    bars.forEach(bar => {
                        let randomHeight = Math.floor(Math.random() * 30) + 5;
                        bar.style.height = randomHeight + 'px';
                    });
                }
            } else {
                // Reset bar bila pause
                bars.forEach(bar => {
                    bar.style.height = '5px';
                });
            }
        }
    </script>

</body>
</html>
