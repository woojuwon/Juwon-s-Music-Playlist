<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juwon's Music & Lyrics ✨</title>

    <style>
        :root {
            --pastel-pink: #ffd1dc;
            --pastel-purple: #e2d1f9;
            --deep-purple: #8b5cf6;
            --text-dark: #4a4063;
            --bg-color: #fdf8fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .music-card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(226, 209, 249, 0.3);
            border: 2px solid var(--pastel-pink);
            text-align: center;
        }
        .album-art {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ffd1dc, #e2d1f9);
            border-radius: 50%;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 6px 15px rgba(244, 114, 182, 0.3);
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        h2 {
            color: #6b46c1;
            margin-bottom: 4px;
            font-size: 20px;
        }
        .artist {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 12px;
        }
        .lyrics-box {
            background-color: #faf5ff;
            border: 2px solid #f3e8ff;
            border-radius: 16px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #4a4063;
        }
        .lyrics-title {
            font-weight: 600;
            color: #6b46c1;
            margin-bottom: 8px;
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="music-card">
        <div class="album-art">💖</div>
        <h2>Sampai Akhir</h2>
        <div class="artist">Judika & Duma 🌸</div>

        <!-- Ruangan Audio (Boleh masukkan pautan fail MP3 lagu nanti) -->
        <audio controls>
            <source src="URL_FAIL_MP3_LAGU_DI_SINI" type="audio/mp3">
            Pelayar anda tidak menyokong pemain audio.
        </audio>

        <div class="lyrics-box">
            <div class="lyrics-title">Preview Lirik 🎵</div>
            <p>
                Cinta kita melukiskan sejarah...<br>
                Membawa kita ke gerbang bahagia...<br>
                Janji ku 'tuk setia bersamamu,<br>
                Sampai akhir menutup mata... ✨
            </p>
        </div>
    </div>
</div>

</body>
</html>
