<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juwon's Music Player 🌸</title>
    <!-- Import Font Comel Tulisan Tangan (Google Fonts: Itim) -->
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf2f8;
            --card-bg: #ffffff;
            --primary-color: #f472b6;
            --secondary-color: #a78bfa;
            --text-color: #4a4063;
            --shadow: 0 20px 40px rgba(244, 114, 182, 0.2);
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            /* Guna font comel style handwriting */
            font-family: 'Itim', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: var(--text-color);
        }

        .player-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 36px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 800px;
            border: 2px solid #ffd1dc;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            box-sizing: border-box;
        }

        /* Bahagian Kiri: Vinyl */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vinyl-container {
            position: relative;
            width: 260px;
            height: 260px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            background: #1f1f1f;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
            background-image: 
                radial-gradient(circle, transparent 32%, #2c2c2c 33%, #2c2c2c 35%, transparent 36%),
                radial-gradient(circle, transparent 50%, #2c2c2c 51%, #2c2c2c 53%, transparent 54%),
                radial-gradient(circle, transparent 68%, #2c2c2c 69%, #2c2c2c 71%, transparent 72%),
                radial-gradient(circle, transparent 85%, #2c2c2c 86%, #2c2c2c 88%, transparent 89%);
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-center {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bahagian Kanan: Info, Visualizer & Lirik */
        .right-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .song-title {
            font-size: 1.8rem;
            font-weight: normal;
            color: #6b46c1;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .song-artist {
            font-size: 1.1rem;
            color: #b09dc9;
            margin-bottom: 20px;
        }

        /* Audio Visualizer */
        .visualizer {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            gap: 6px;
            height: 40px;
            margin-bottom: 20px;
            width: 100%;
        }

        .bar {
            width: 8px;
            background: linear-gradient(to top, var(--primary-color), var(--secondary-color));
            border-radius: 4px;
            height: 6px;
            transition: height 0.08s ease;
        }

        /* Kotak Lirik Estetik */
        .lyrics-container {
            background-color: #faf5ff;
            border: 2px solid #f3e8ff;
            border-radius: 20px;
            padding: 18px;
            width: 100%;
            height: 150px;
            overflow-y: auto;
            box-sizing: border-box;
            margin-bottom: 24px;
        }

        .lyrics-text {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #5b4b7c;
            margin: 0;
            letter-spacing: 0.3px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        button {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-family: 'Itim', cursive, sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.4);
            transition: transform 0.1s, opacity 0.2s;
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        /* Responsif untuk Phone kecil */
        @media (max-width: 768px) {
            .player-card {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 20px;
                text-align: center;
            }
            .right-side {
                text-align: center;
            }
            .visualizer {
                justify-content: center;
            }
            .vinyl-container {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- SEBELAH KIRI: Vinyl Besar -->
        <div class="left-side">
            <div class="vinyl-container">
                <div class="vinyl" id="vinylRecord">
                    <div class="vinyl-center"></div>
                </div>
            </div>
        </div>

        <!-- SEBELAH KANAN: Info, Beat & Lirik -->
        <div class="right-side">
            <div class="song-title">Sampai Akhir 💖</div>
            <div class="song-artist">Judika & Duma 🌸</div>

            <!-- Visualizer Beat Music -->
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <!-- Ruangan Lirik -->
            <div class="lyrics-container">
                <p class="lyrics-text" id="lyricsDisplay">
                    "Cinta kita melukiskan sejarah...<br>
                    Membawa kita ke gerbang bahagia...<br>
                    Janji ku 'tuk setia bersamamu,<br>
                    Sampai akhir menutup mata..." ✨
                </p>
            </div>

            <!-- Audio Element -->
            <audio id="audioPlayer" src="sampai-akhir.mp3"></audio>
            
            <!-- Butang Kawalan -->
            <div class="controls">
                <button id="playBtn">Play 🎵</button>
                <button id="pauseBtn">Pause ⏸️</button>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const vinyl = document.getElementById('vinylRecord');
        const bars = document.querySelectorAll('.bar');

        let audioCtx, analyser, source, dataArray;
        let isInitialized = false;

        function initAudioContext() {
            if (isInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isInitialized = true;
            } catch (e) {
                console.log("Web Audio API not supported", e);
            }
        }

        playBtn.addEventListener('click', () => {
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            audio.play();
            vinyl.classList.add('playing');
            animateVisualizer();
        });

        pauseBtn.addEventListener('click', () => {
            audio.pause();
            vinyl.classList.remove('playing');
        });

        function animateVisualizer() {
            if (!audio.paused) {
                requestAnimationFrame(animateVisualizer);
                if (analyser) {
                    analyser.getByteFrequencyData(dataArray);
                    bars.forEach((bar, index) => {
                        let value = dataArray[index * 2] || 8;
                        let height = (value / 255) * 35 + 6;
                        bar.style.height = height + 'px';
                    });
                } else {
                    bars.forEach(bar => {
                        let randomHeight = Math.floor(Math.random() * 30) + 6;
                        bar.style.height = randomHeight + 'px';
                    });
                }
            } else {
                bars.forEach(bar => {
                    bar.style.height = '6px';
                });
            }
        }
    </script>

</body>
</html>
